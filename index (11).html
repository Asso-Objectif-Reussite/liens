<!doctype html>
<!--
  Page de redirection des liens courts de l'association.
  index.html et 404.html sont IDENTIQUES : ne pas les modifier.
  Les liens se gèrent uniquement dans liens.js.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Objectif Réussite</title>
<script>
  /* Site servi à la racine : https://asso-objectif-reussite.github.io/nom-court
     (dépôt nommé asso-objectif-reussite.github.io, ou domaine personnalisé).
     Seulement si le site est un jour déplacé dans un dépôt ordinaire, mets son nom ici : PROJET = 'nom-du-depot'. */
  var PROJET = '';
  (function () {
    var segs = location.pathname.split('/').filter(Boolean);
    if (PROJET && segs[0] && segs[0].toLowerCase() === PROJET.toLowerCase()) segs = segs.slice(1);
    window.BASE = PROJET ? '/' + PROJET + '/' : '/';
    window.CLE = segs.join('/').replace(/(^|\/)index\.html$/i, '').toLowerCase();
    document.write('<base href="' + window.BASE + '">');
  })();
</script>
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#172030; --muted:#5A6474; --line:#DCE1E8;
  --gold:#8F6D12; --gold-soft:#F4ECD6; --focus:#2F6FEB;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#11151C; --surface:#1A2029; --ink:#E6EAF0; --muted:#9BA5B4; --line:#2E3643; --gold:#D9B75A; --gold-soft:#3A3220; --focus:#7AA7FF; color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:36px 18px 48px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
header img{height:44px;width:auto}
h1{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.015em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.notice{background:var(--gold-soft);border-radius:10px;padding:12px 14px;margin:0 0 20px;font-size:14.5px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li+li{border-top:1px solid var(--line)}
.lien{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;padding:16px 18px}
.lien a{color:inherit;text-decoration:none;font-weight:600;font-size:17px}
.lien a:hover{text-decoration:underline}
.lien a::after{content:"";position:absolute;inset:0}
.lien{position:relative}
.lien .desc{grid-column:1;color:var(--muted);font-size:14px}
.lien .court{grid-column:1;font-size:13.5px;color:var(--gold);font-weight:600;overflow-wrap:anywhere}
.lien button{grid-column:2;grid-row:1/span 3;position:relative;z-index:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:13.5px;cursor:pointer;min-height:40px}
.lien button:hover{background:var(--bg)}
.vide{padding:22px 18px;color:var(--muted)}
.redir{text-align:center;padding-top:18vh}
.redir img{height:52px;width:auto;margin-bottom:18px}
.redir p{margin:6px 0;color:var(--muted)}
.redir a{color:var(--gold);font-weight:600}
footer{margin-top:22px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<script src="liens.js"></script>
<script>
(function () {
  var L = window.LIENS || {};
  var app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var court = function (cle) { return location.host + window.BASE + cle; };
  var valide = function (e) { return e && /^https?:\/\//i.test(e.url || ''); };
  var cle = window.CLE, lien = L[cle];

  // 1. Lien connu : redirection immédiate (paramètres ?… et #… transmis)
  if (cle && valide(lien)) {
    document.title = lien.titre || 'Objectif Réussite';
    var cible = lien.url;
    if (location.search) cible += (cible.indexOf('?') === -1 ? '?' : '&') + location.search.slice(1);
    if (location.hash && cible.indexOf('#') === -1) cible += location.hash;
    app.innerHTML = '<div class="redir"><img src="logo.png" alt=""><p>Ouverture de <b>' + esc(lien.titre || cle) + '</b>…</p>' +
      '<p><a href="' + esc(cible) + '">Touche ici si rien ne se passe</a></p></div>';
    location.replace(cible);
    return;
  }

  // 2. Page d'accueil : liste des outils (et message si le lien demandé n'existe pas)
  document.title = 'Les outils d\'Objectif Réussite';
  var cles = Object.keys(L).filter(function (k) { return valide(L[k]) && !L[k].cache; });
  var html = '<header><img src="logo.png" alt=""><div><h1>Les outils de l\'association</h1><p>Objectif Réussite</p></div></header>';
  if (cle) {
    html += '<p class="notice">' + (lien ? 'Le lien <b>/' + esc(cle) + '</b> n\'est pas encore configuré.'
      : 'Le lien <b>/' + esc(cle) + '</b> n\'existe pas. Vérifie l\'adresse ou choisis un outil ci-dessous.') + '</p>';
  }
  html += cles.length ? '<ul>' + cles.map(function (k) {
    var e = L[k];
    return '<li class="lien"><a href="' + esc(e.url) + '">' + esc(e.titre || k) + '</a>' +
      (e.description ? '<span class="desc">' + esc(e.description) + '</span>' : '') +
      '<span class="court">' + esc(court(k)) + '</span>' +
      '<button type="button" data-copie="' + esc('https://' + court(k)) + '">Copier</button></li>';
  }).join('') + '</ul>' : '<ul><li class="vide">Aucun outil pour le moment : ajoute un lien dans liens.js.</li></ul>';
  html += '<footer>Connexion avec ton adresse @or-edhec.com.</footer>';
  app.innerHTML = html;

  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-copie]');
    if (!b) return;
    var txt = b.getAttribute('data-copie');
    var ok = function () { var t = b.textContent; b.textContent = 'Copié'; setTimeout(function () { b.textContent = t; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, function () { prompt('Copie ce lien :', txt); });
    else prompt('Copie ce lien :', txt);
  });
})();
</script>
</body>
</html>
